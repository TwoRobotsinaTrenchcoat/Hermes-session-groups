name: session-groups
version: 0.1.0
description: |
  Cross-platform session routing. Maps different (platform, chat_id) pairs
  to a shared session so messages from different platforms share one
  conversation history.

  EXPERIMENTAL — designed against ZK-Snarky's upstream adapter-side PR #135404
  which has NOT merged yet. This plugin patches the
  `gateway.session.session_group_source` seam directly and will only work
  once that PR lands. Do not deploy to a live gateway until the PR merges.

enabled: false
